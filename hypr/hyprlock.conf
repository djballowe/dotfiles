source = ~/.config/hypr/colors.conf

# BACKGROUND
background {
    monitor =
    path = /home/david/pictures/papes/black-sand.jpg
    blur_passes = 2
    contrast = 1
    brightness = 0.5
    vibrancy = 0.2
    vibrancy_darkness = 0.2
}

# GENERAL
general {
    no_fade_in = true
    no_fade_out = true
    hide_cursor = true 
    grace = 0
    disable_loading_bar = true
}

# AUTH LABEL
label {
    monitor =
    text = [ authenticate ]
    color = $fg_alpha
    font_size = 17
    font_family = JetBrainsMono Nerd Font
    position = 0, 70
    halign = center
    valign = center
}

# INPUT FIELD
input-field {
    monitor =
    placeholder_text =
    fail_text =
    size = 420, 50
    outline_thickness = 2
    outer_color = $fg_alpha
    inner_color = $bg_alpha
    font_color = $fg
    dots_size = 0.28
    dots_spacing = 0.30
    dots_center = true
    fade_on_empty = false
    check_color = $accent
    hide_input = false
    position = 0, 0
    rounding = 0
    halign = center
    valign = center
}

